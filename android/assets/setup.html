<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>K-Desktop</title>
  <style>
    :root {
      --bg: #f5f3ee; --glass: rgba(255, 255, 255, .7); --line: rgba(40, 30, 10, .12); --text: #17140d;
      --text-2: rgba(23, 20, 13, .66); --accent-soft: rgba(224, 154, 0, .15); --glow: rgba(224, 154, 0, .35);
      --danger: #d0342c; --gold: linear-gradient(135deg, #ffd96b, #f6b52a 52%, #dc8d00);
      --a1: rgba(255, 196, 64, .55); --a2: rgba(255, 150, 90, .3);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0f; --glass: rgba(28, 28, 32, .7); --line: rgba(255, 255, 255, .1); --text: #f5f5f4;
        --text-2: rgba(255, 255, 255, .66); --accent-soft: rgba(245, 179, 36, .15); --glow: rgba(245, 179, 36, .4);
        --danger: #ff6b6b; --a1: rgba(245, 170, 30, .22); --a2: rgba(255, 110, 60, .12);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; padding: 24px 20px;
      font: 15px/1.5 system-ui, -apple-system, Roboto, "Segoe UI", sans-serif; overflow-x: hidden;
    }
    .ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .ambient i { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; filter: blur(70px); }
    .ambient i:first-child { background: radial-gradient(circle, var(--a1), transparent 65%); left: -40vmax; top: -45vmax; animation: d1 24s ease-in-out infinite alternate; }
    .ambient i:last-child { background: radial-gradient(circle, var(--a2), transparent 65%); right: -45vmax; bottom: -40vmax; animation: d2 30s ease-in-out infinite alternate; }
    @keyframes d1 { to { transform: translate(20vw, 15vh); } }
    @keyframes d2 { to { transform: translate(-20vw, -15vh); } }
    .card {
      width: 100%; max-width: 420px; text-align: center; padding: 30px 22px 24px; border-radius: 30px;
      background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .18); animation: in .55s cubic-bezier(.2, .8, .2, 1);
    }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } }
    .logo { position: relative; width: 92px; height: 92px; margin: 0 auto 16px; }
    .logo::before {
      content: ""; position: absolute; inset: -14px; border-radius: 34px; filter: blur(14px);
      background: conic-gradient(from 0deg, transparent, var(--glow), transparent 40%, var(--glow), transparent 80%);
      animation: spin 6s linear infinite;
    }
    .logo img { position: relative; width: 92px; height: 92px; border-radius: 26px; animation: float 4s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-6px); } }
    h1 { margin: 0 0 8px; font-size: 25px; font-weight: 700; letter-spacing: -.01em; }
    p { margin: 0 0 20px; color: var(--text-2); }
    label { display: block; text-align: left; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 0 0 6px 4px; }
    input {
      width: 100%; padding: 15px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass);
      color: var(--text); font-size: 16px; outline: 0; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #f2b21c; box-shadow: 0 0 0 4px var(--accent-soft); }
    .hint { font-size: 13px; text-align: left; margin: 10px 4px 18px; }
    .hint code { padding: 1px 6px; border-radius: 6px; background: var(--accent-soft); font-size: 12.5px; }
    .error { min-height: 20px; margin: 0 0 12px; color: var(--danger); font-size: 14px; }
    button {
      width: 100%; padding: 15px; border: 0; border-radius: 16px; font: 700 16px system-ui, sans-serif; cursor: pointer;
      background: var(--gold); color: #1f1500; box-shadow: 0 8px 22px var(--glow); transition: transform .2s;
    }
    button:active { transform: scale(.97); }
    button.ghost { margin-top: 10px; background: none; box-shadow: none; color: var(--text); border: 1px solid var(--line); }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <div class="ambient"><i></i><i></i></div>
  <form class="card" id="form" autocomplete="off" novalidate>
    <div class="logo"><img src="icon.png" alt=""></div>
    <h1 data-t="title"></h1>
    <p data-t="text"></p>
    <label for="server" data-t="label"></label>
    <input id="server" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" spellcheck="false" placeholder="https://kdesktop.example.com">
    <div class="hint" data-t="hint"></div>
    <div class="error" id="error"></div>
    <button type="submit" data-t="connect"></button>
    <button type="button" class="ghost" id="retry" data-t="retry" hidden></button>
  </form>
  <script>
    const T = {
      es: { title: 'Conectar con K-Desktop', text: 'Escribe la dirección de K-Desktop en tu PC. Solo hace falta la primera vez.', label: 'Dirección',
            hint: 'La de tu proxy con HTTPS (<code>kdesktop.tudominio.net</code>) o la del PC en tu red (<code>192.168.1.10:2502</code>). También vale el enlace de emparejar.',
            connect: 'Conectar', retry: 'Reintentar', bad: 'Esa dirección no es válida', failed: 'No se pudo conectar: {0}' },
      en: { title: 'Connect to K-Desktop', text: 'Type the address of K-Desktop on your PC. Only needed the first time.', label: 'Address',
            hint: 'Your HTTPS proxy (<code>kdesktop.yourdomain.net</code>) or the PC on your network (<code>192.168.1.10:2502</code>). A pairing link works too.',
            connect: 'Connect', retry: 'Retry', bad: 'That address is not valid', failed: 'Could not connect: {0}' },
      fr: { title: 'Se connecter à K-Desktop', text: 'Saisissez l’adresse de K-Desktop sur votre PC. Seulement la première fois.', label: 'Adresse',
            hint: 'Celle de votre proxy HTTPS (<code>kdesktop.votredomaine.net</code>) ou du PC sur votre réseau (<code>192.168.1.10:2502</code>). Un lien d’association fonctionne aussi.',
            connect: 'Se connecter', retry: 'Réessayer', bad: 'Cette adresse n’est pas valide', failed: 'Connexion impossible : {0}' },
      de: { title: 'Mit K-Desktop verbinden', text: 'Gib die Adresse von K-Desktop auf deinem PC ein. Nur beim ersten Mal nötig.', label: 'Adresse',
            hint: 'Die deines HTTPS-Proxys (<code>kdesktop.deinedomain.net</code>) oder die des PCs im Netzwerk (<code>192.168.1.10:2502</code>). Ein Kopplungslink geht auch.',
            connect: 'Verbinden', retry: 'Erneut versuchen', bad: 'Diese Adresse ist ungültig', failed: 'Verbindung fehlgeschlagen: {0}' },
      it: { title: 'Connetti a K-Desktop', text: 'Scrivi l’indirizzo di K-Desktop sul tuo PC. Serve solo la prima volta.', label: 'Indirizzo',
            hint: 'Quello del tuo proxy HTTPS (<code>kdesktop.tuodominio.net</code>) o del PC nella tua rete (<code>192.168.1.10:2502</code>). Va bene anche il link di abbinamento.',
            connect: 'Connetti', retry: 'Riprova', bad: 'Questo indirizzo non è valido', failed: 'Impossibile connettersi: {0}' },
      pt: { title: 'Conectar ao K-Desktop', text: 'Digite o endereço do K-Desktop no seu PC. Só é preciso na primeira vez.', label: 'Endereço',
            hint: 'O do seu proxy HTTPS (<code>kdesktop.seudominio.net</code>) ou o do PC na sua rede (<code>192.168.1.10:2502</code>). O link de pareamento também serve.',
            connect: 'Conectar', retry: 'Tentar de novo', bad: 'Esse endereço não é válido', failed: 'Não foi possível conectar: {0}' },
    };
    const lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    const t = T[lang] || T.en;
    for (const e of document.querySelectorAll('[data-t]')) e.innerHTML = t[e.dataset.t];
    document.documentElement.lang = T[lang] ? lang : 'en';

    const params = new URLSearchParams(location.search);
    const input = document.getElementById('server');
    const app = window.KDesktopApp;
    input.value = params.get('server') || (app && app.getServer()) || '';
    if (params.get('error')) {
      document.getElementById('error').textContent = t.failed.replace('{0}', params.get('error'));
      if (input.value) document.getElementById('retry').hidden = false;
    }
    document.getElementById('retry').addEventListener('click', () => app && app.retry());
    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const ok = app && app.setServer(input.value);
      if (ok) return;
      document.getElementById('error').textContent = t.bad;
      const card = document.getElementById('form');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    });
    if (!input.value) input.focus();
  </script>
</body>
</html>
