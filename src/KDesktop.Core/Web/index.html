<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K-Desktop">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="kd.css">
  <link rel="stylesheet" href="app.css">
  <title>K-Desktop 5.0</title>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Slow golden light behind the glass surfaces -->
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <!-- Pairing -->
  <section class="pair" id="pair" hidden>
    <div class="pair-card">
      <div class="pair-logo"><img src="icons/icon-192.png" alt=""></div>
      <h1 data-i18n="pwa.pair.title"></h1>
      <p class="muted" data-i18n="pwa.pair.text"></p>
      <form id="pairForm" autocomplete="off">
        <label class="field">
          <span data-i18n="pwa.pair.code"></span>
          <input id="pairCode" class="code-input" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" required>
        </label>
        <label class="field">
          <span data-i18n="pwa.pair.name"></span>
          <input id="pairName" maxlength="60" required>
        </label>
        <p class="pair-error" id="pairError" role="alert"></p>
        <button class="btn primary wide" id="pairButton" type="submit" data-i18n="pwa.pair.button"></button>
      </form>
    </div>
  </section>

  <!-- App -->
  <div class="shell" id="shell" hidden>
    <header class="top" id="top">
      <!-- The PC: its name and how the connection is; it opens its sheet (reconnect, switch PC, power) -->
      <button class="pc-pill" id="connPill" data-state="connecting" data-i18n-title="pwa.pc.title">
        <span class="pc-pill-icon" data-icon="monitor"></span>
        <span class="pc-pill-text"><b id="machine"></b><small><i></i><span id="connText"></span></small></span>
        <span class="pc-pill-chevron" data-icon="chevronDown"></span>
      </button>
      <button class="icon-btn inbox-btn" id="inboxButton" data-icon="inbox" data-i18n-title="pwa.inbox.title" hidden></button>
      <button class="icon-btn voice-btn" id="voiceButton" data-icon="mic" data-i18n-title="pwa.voice.button" hidden></button>
      <button class="icon-btn" id="settingsButton" data-icon="settings" data-i18n-title="pwa.tab.settings"></button>
    </header>

    <main class="views">
      <div class="title-row">
        <button class="icon-btn title-back" id="titleBack" data-icon="back" data-i18n-title="pwa.back" hidden></button>
        <h1 class="big-title" id="bigTitle"></h1>
      </div>

      <section class="view" data-view="menus">
        <nav class="chips" id="menuChips"></nav>
        <div class="crumbs" id="crumbs" hidden>
          <button class="crumb-back" id="backButton" data-i18n-title="pwa.back" data-icon="back"></button>
          <div class="crumb-path" id="crumbPath"></div>
        </div>
        <div class="stack" id="menuStack"></div>
      </section>

      <section class="view" data-view="all">
        <div class="search">
          <span class="search-icon" data-icon="search"></span>
          <input id="searchBox" type="search" enterkeyhint="go" autocomplete="off" data-i18n-placeholder="pwa.search">
          <span class="count" id="allCount"></span>
          <button class="hidden-toggle" id="hiddenToggle" data-i18n-title="pwa.filter.hidden" aria-pressed="false" hidden></button>
        </div>
        <nav class="chips filters" id="cmdFilters"></nav>
        <div class="top-strip" id="favStrip" hidden>
          <h3 class="section-title" data-i18n="pwa.favorites"></h3>
          <div class="strip" id="favList"></div>
        </div>
        <div class="top-strip" id="topStrip" hidden>
          <h3 class="section-title" data-i18n="pwa.mostUsed"></h3>
          <div class="strip" id="topList"></div>
        </div>
        <div id="allGrid"></div>
        <p class="empty" id="allEmpty" hidden></p>
      </section>

      <section class="view pad-view" data-view="pad">
        <div class="pad-bar">
          <span class="pad-bar-buttons">
            <button class="icon-btn small" id="keysButton" data-icon="keys" data-i18n-title="pwa.pad.keys"></button>
            <button class="icon-btn small" id="keyboardButton" data-icon="keyboard" data-i18n-title="pwa.pad.keyboard"></button>
            <button class="icon-btn small" id="zoomButton" data-icon="zoom" data-i18n-title="pwa.pad.zoom"></button>
          </span>
        </div>
        <div class="pad" id="pad">
          <div class="pad-glow" aria-hidden="true"></div>
          <span class="zoom-steps" id="zoomSteps" hidden>
            <button class="icon-btn small" id="zoomOut" data-icon="minus" data-i18n-title="pwa.pad.zoomOut"></button>
            <b id="zoomText"></b>
            <button class="icon-btn small" id="zoomIn" data-icon="plus" data-i18n-title="pwa.pad.zoomIn"></button>
          </span>
          <p class="pad-hint" id="padHint" data-i18n="pwa.pad.hint"></p>
          <span class="pad-drag" id="padDrag" data-i18n="pwa.pad.dragging"></span>
          <span class="pad-gesture" id="padGesture" aria-live="polite"></span>
        </div>
        <div class="pad-buttons">
          <button data-button="l" data-i18n-title="pwa.pad.left"></button>
          <button data-button="m" class="middle" data-i18n-title="pwa.pad.middle"></button>
          <button data-button="r" data-i18n-title="pwa.pad.right"></button>
        </div>
        <!-- The special keys go down here, right above the keyboard (the phone one or the on-screen one) -->
        <div class="keys" id="keysPanel" hidden>
          <div class="keys-row" id="keysMods"></div>
          <div class="keys-row" id="keysNav"></div>
        </div>
        <!-- On a computer there is no phone keyboard to open: an on-screen one instead -->
        <div class="vk" id="vk" hidden></div>
        <p class="pad-off" id="padOff" data-i18n="pwa.pad.disabled" hidden></p>
        <textarea class="kb-input" id="kbInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"
                  enterkeyhint="enter" aria-hidden="true" tabindex="-1"></textarea>
      </section>

      <section class="view" data-view="audio">
        <!-- What plays on the PC: the program's cover, title, progress and buttons (one or another with the chips) -->
        <div class="card now-card" id="nowCard" hidden>
          <nav class="chips now-chips" id="nowChips" hidden></nav>
          <div class="now-main">
            <div class="now-art" id="nowArt"><span data-icon="music"></span></div>
            <div class="now-text">
              <b id="nowTitle"></b>
              <span id="nowArtist"></span>
              <small id="nowApp"></small>
            </div>
          </div>
          <div class="now-progress" id="nowProgress" hidden>
            <input type="range" id="nowSeek" min="0" max="1000" step="1" value="0" data-i18n-title="pwa.media.seek">
            <div class="now-times"><span id="nowAt"></span><span id="nowLength"></span></div>
          </div>
          <div class="media-row now-buttons">
            <button class="round-btn" id="nowPrev" data-icon="previous" data-i18n-title="pwa.audio.previous"></button>
            <button class="round-btn play" id="nowPlay" data-i18n-title="pwa.audio.playPause"></button>
            <button class="round-btn" id="nowNext" data-icon="next" data-i18n-title="pwa.audio.next"></button>
          </div>
        </div>
        <div class="card volume-card" id="volumeCard">
          <div class="dial" id="dial" role="slider" aria-valuemin="0" aria-valuemax="100" tabindex="0">
            <svg viewBox="0 0 220 220" aria-hidden="true">
              <defs>
                <linearGradient id="dialGradient" x1="0" y1="1" x2="1" y2="0">
                  <stop offset="0" stop-color="#f7b32b" />
                  <stop offset="1" stop-color="#ffd970" />
                </linearGradient>
              </defs>
              <circle class="dial-track" cx="110" cy="110" r="92" pathLength="100" />
              <circle class="dial-fill" id="dialFill" cx="110" cy="110" r="92" pathLength="100" />
              <circle class="dial-knob" id="dialKnob" cx="110" cy="18" r="11" />
            </svg>
            <div class="dial-center">
              <div class="volume-value"><b id="volumeValue">–</b><span>%</span></div>
              <button class="mute-btn" id="muteButton"></button>
            </div>
          </div>
          <div class="volume-row">
            <button class="round-btn" id="volDown" data-icon="minus" aria-label="−"></button>
            <input type="range" id="volumeSlider" min="0" max="100" step="1" value="0">
            <button class="round-btn" id="volUp" data-icon="plus" aria-label="+"></button>
          </div>
          <div class="media-row" id="mediaKeys">
            <button class="round-btn" data-media="previous" data-icon="previous" data-i18n-title="pwa.audio.previous"></button>
            <button class="round-btn play" data-media="playPause" data-icon="playPause" data-i18n-title="pwa.audio.playPause"></button>
            <button class="round-btn" data-media="next" data-icon="next" data-i18n-title="pwa.audio.next"></button>
          </div>
          <!-- Keys for the player in front (seek, its own volume, pause), laid out like a keyboard -->
          <div class="keys-pad" id="keysPad">
            <p class="keys-hint" data-i18n="pwa.audio.keysHint"></p>
            <div class="keys-grid">
              <button class="round-btn key-up" data-key="up" data-icon="arrowUp" data-i18n-title="pwa.audio.keyUp"></button>
              <button class="round-btn key-left" data-key="left" data-icon="arrowLeft" data-i18n-title="pwa.audio.keyLeft"></button>
              <button class="round-btn key-down" data-key="down" data-icon="arrowDown" data-i18n-title="pwa.audio.keyDown"></button>
              <button class="round-btn key-right" data-key="right" data-icon="arrowRight" data-i18n-title="pwa.audio.keyRight"></button>
              <button class="round-btn key-space" data-key="space" data-icon="space" data-i18n-title="pwa.audio.keySpace"></button>
            </div>
          </div>
        </div>
        <div id="appsBlock" hidden>
          <h3 class="section-title" data-i18n="pwa.audio.apps"></h3>
          <div class="group" id="appList"></div>
        </div>
        <h3 class="section-title" data-i18n="pwa.audio.output"></h3>
        <div class="devices" id="deviceList"></div>
      </section>

      <!-- The assistants: the same conversations as Panel → Assistant on the PC; write or talk to one -->
      <section class="view chat-view" data-view="assistant">
        <nav class="chips assistant-chips" id="assistantChips"></nav>
        <div class="chat" id="chatList" aria-live="polite"></div>
        <p class="empty" id="chatEmpty" hidden></p>
        <form class="chat-bar" id="chatForm" autocomplete="off">
          <button type="button" class="icon-btn chat-mic" id="chatMic" data-icon="mic" data-i18n-title="pwa.chat.talk" hidden></button>
          <textarea id="chatInput" rows="1" maxlength="2000" enterkeyhint="send"></textarea>
          <button type="submit" class="icon-btn chat-send" id="chatSend" data-icon="send" data-i18n-title="pwa.chat.send"></button>
          <button type="button" class="icon-btn chat-stop" id="chatStop" data-icon="stop" data-i18n-title="pwa.chat.stop" hidden></button>
        </form>
      </section>

      <section class="view" data-view="settings">
        <div class="device-hero card">
          <span class="device-avatar" data-icon="phone"></span>
          <div>
            <p class="device-name" id="deviceName"></p>
            <p class="muted" id="connectedTo"></p>
          </div>
        </div>

        <h3 class="section-title" data-i18n="pwa.settings.appearance"></h3>
        <div class="group">
          <div class="row">
            <span class="row-icon" data-icon="theme"></span>
            <span class="row-label" data-i18n="pwa.settings.theme"></span>
            <div class="segmented" id="themeSwitch">
              <button data-theme="system" data-i18n="pwa.theme.system"></button>
              <button data-theme="light" data-i18n="pwa.theme.light"></button>
              <button data-theme="dark" data-i18n="pwa.theme.dark"></button>
              <span class="seg-pill"></span>
            </div>
          </div>
          <label class="row">
            <span class="row-icon" data-icon="language"></span>
            <span class="row-label" data-i18n="pwa.settings.language"></span>
            <select id="langSelect"></select>
          </label>
        </div>

        <div id="padSettings">
          <h3 class="section-title" data-i18n="pwa.tab.pad"></h3>
          <div class="group">
            <label class="row slider-row">
              <span class="row-icon" data-icon="pointer"></span>
              <span class="row-label" data-i18n="pwa.pad.speed"></span>
              <input type="range" id="padSpeed" min="0.5" max="4" step="0.1">
            </label>
            <label class="row slider-row">
              <span class="row-icon" data-icon="speed"></span>
              <span class="row-label" data-i18n="pwa.pad.accel"></span>
              <input type="range" id="padAccel" min="0" max="2" step="0.1">
            </label>
            <label class="row slider-row">
              <span class="row-icon" data-icon="scroll"></span>
              <span class="row-label" data-i18n="pwa.pad.scrollSpeed"></span>
              <input type="range" id="padScroll" min="0.5" max="4" step="0.1">
            </label>
            <label class="row">
              <span class="row-icon" data-icon="natural"></span>
              <span class="row-label" data-i18n="pwa.pad.natural"></span>
              <input type="checkbox" class="switch" id="padNatural">
            </label>
            <label class="row">
              <span class="row-icon" data-icon="tap"></span>
              <span class="row-label" data-i18n="pwa.pad.tapClick"></span>
              <input type="checkbox" class="switch" id="padTap">
            </label>
            <label class="row">
              <span class="row-icon" data-icon="fingers"></span>
              <span class="row-label"><span data-i18n="pwa.pad.gestures"></span><small class="row-sub" data-i18n="pwa.pad.gesturesHint"></small></span>
              <input type="checkbox" class="switch" id="padGestures">
            </label>
            <label class="row">
              <span class="row-icon" data-icon="zoom"></span>
              <span class="row-label"><span data-i18n="pwa.pad.pinch"></span><small class="row-sub" data-i18n="pwa.pad.pinchHint"></small></span>
              <input type="checkbox" class="switch" id="padPinch">
            </label>
            <button class="row row-button" id="padKeysEdit">
              <span class="row-icon" data-icon="keys"></span>
              <span class="row-label"><span data-i18n="pwa.pad.keys"></span><small class="row-sub" id="padKeysText"></small></span>
              <span class="row-chevron" data-icon="chevron"></span>
            </button>
          </div>
        </div>

        <!-- The assistants: where the answers to this phone's orders sound, and keep listening after them -->
        <div id="speechSettings" hidden>
          <h3 class="section-title" data-i18n="pwa.tab.assistant"></h3>
          <div class="group">
            <label class="row" id="speakWhereRow">
              <span class="row-icon" data-icon="speaker"></span>
              <span class="row-label" data-i18n="pwa.speech.where"></span>
              <select id="speakWhere">
                <option value="phone" data-i18n="pwa.speech.phone"></option>
                <option value="pc" data-i18n="pwa.speech.pc"></option>
                <option value="both" data-i18n="pwa.speech.both"></option>
              </select>
            </label>
            <label class="row">
              <span class="row-icon" data-icon="mic"></span>
              <span class="row-label"><span data-i18n="pwa.speech.follow"></span><small class="row-sub" data-i18n="pwa.speech.followHint"></small></span>
              <input type="checkbox" class="switch" id="speakFollow">
            </label>
          </div>
        </div>

        <div id="mediaNoticeRow" hidden>
          <h3 class="section-title" data-i18n="pwa.tab.audio"></h3>
          <div class="group">
            <label class="row">
              <span class="row-icon" data-icon="music"></span>
              <span class="row-label"><span data-i18n="pwa.media.notice"></span><small class="row-sub" data-i18n="pwa.media.noticeHint"></small></span>
              <input type="checkbox" class="switch" id="mediaNotice">
            </label>
          </div>
        </div>

        <div id="inboxBackgroundRow" hidden>
          <h3 class="section-title" data-i18n="pwa.inbox.title"></h3>
          <div class="group">
            <label class="row">
              <span class="row-icon" data-icon="inbox"></span>
              <span class="row-label"><span data-i18n="pwa.inbox.background"></span><small class="row-sub" data-i18n="pwa.inbox.backgroundHint"></small></span>
              <input type="checkbox" class="switch" id="inboxBackground">
            </label>
          </div>
        </div>

        <h3 class="section-title" data-i18n="pwa.settings.device"></h3>
        <div class="group">
          <button class="row row-button" id="reloadButton">
            <span class="row-icon" data-icon="refresh"></span>
            <span class="row-label" data-i18n="pwa.settings.refresh"></span>
            <span class="row-chevron" data-icon="chevron"></span>
          </button>
          <button class="row row-button accent" id="appUpdateButton" hidden>
            <span class="row-icon" data-icon="install"></span>
            <span class="row-label"><span data-i18n="pwa.appUpdate.button"></span><small class="row-sub" id="appUpdateText"></small></span>
            <span class="row-chevron" data-icon="chevron"></span>
          </button>
          <button class="row row-button accent" id="installButton" hidden>
            <span class="row-icon" data-icon="install"></span>
            <span class="row-label" data-i18n="pwa.install"></span>
            <span class="row-chevron" data-icon="chevron"></span>
          </button>
          <button class="row row-button" id="serverButton" hidden>
            <span class="row-icon" data-icon="server"></span>
            <span class="row-label"><span data-i18n="pwa.app.changeServer"></span><small class="row-sub" id="serverText"></small></span>
            <span class="row-chevron" data-icon="chevron"></span>
          </button>
          <div id="addressRows" hidden></div>
          <button class="row row-button danger" id="unpairButton">
            <span class="row-icon" data-icon="unlink"></span>
            <span class="row-label" data-i18n="pwa.settings.unpair"></span>
          </button>
        </div>
        <p class="muted center small" id="iosHint" data-i18n="pwa.installIos" hidden></p>

        <div class="about">
          <img src="icons/icon-192.png" alt="">
          <b id="version"></b>
          <span class="muted small" id="appVersion" hidden></span>
          <span class="muted" data-i18n="pwa.tagline"></span>
        </div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <span class="tab-pill" id="tabPill"></span>
      <button data-tab="all"><span data-icon="all"></span><b data-i18n="pwa.tab.all"></b></button>
      <button data-tab="menus"><span data-icon="menus"></span><b data-i18n="pwa.tab.menus"></b></button>
      <button data-tab="pad"><span data-icon="touchpad"></span><b data-i18n="pwa.tab.pad"></b></button>
      <button data-tab="audio"><span data-icon="speaker"></span><b data-i18n="pwa.tab.audio"></b></button>
      <button data-tab="assistant" hidden><span data-icon="chat"></span><b data-i18n="pwa.tab.assistant"></b></button>
    </nav>
  </div>

  <!-- Voice order: listening on the phone, the PC understands it and runs it -->
  <div class="voice-sheet" id="voiceSheet" hidden>
    <button class="voice-orb" id="voiceOrb" data-i18n-title="pwa.voice.stop"><span class="voice-ring" id="voiceRing"></span><span class="voice-mic" data-icon="mic"></span></button>
    <p class="voice-text" id="voiceText"></p>
    <button class="voice-cancel" id="voiceCancel" data-icon="error" data-i18n-title="pwa.voice.cancel"></button>
  </div>

  <!-- What K-Desktop sent to this device («Enviar al móvil») -->
  <div class="inbox-sheet" id="inboxSheet" hidden>
    <div class="inbox-panel">
      <div class="inbox-top">
        <h2 data-i18n="pwa.inbox.title"></h2>
        <button class="btn small" id="inboxClear" data-i18n="pwa.inbox.clear"></button>
        <button class="icon-btn small" id="inboxClose" data-icon="error" data-i18n-title="pwa.inbox.close"></button>
      </div>
      <p class="muted center" id="inboxEmpty" data-i18n="pwa.inbox.empty"></p>
      <div id="inboxList"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
